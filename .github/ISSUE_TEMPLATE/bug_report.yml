name: Bug report
description: Report a reproducible problem in GGUFBox.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Please search existing issues first. Do not include API keys, private prompts, uploaded files, or other sensitive data.
  - type: input
    id: version
    attributes:
      label: GGUFBox version or commit
      placeholder: 0.1.0 or commit SHA
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: OS, Python version, Docker/local, CPU/GPU
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce and relevant logs
      description: Redact secrets and personal data. Attach a screenshot when useful.
    validations:
      required: true
